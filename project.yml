name: Coreader
options:
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

packages:
  Coreader:
    path: .

settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: 1.0.3
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  Coreader:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/CoreaderApp
        excludes:
          - "Web/**"
      # Folder reference: the web reader loads modules by relative path, so the tree
      # must reach the bundle unflattened.
      - path: Sources/CoreaderApp/Web
        type: folder
        buildPhase: resources
      # The agent skill ships inside the app so Settings can install it.
      - path: integrations/skill
        type: folder
        buildPhase: resources
    dependencies:
      - package: Coreader
        product: CoreaderKit
      # The `coreader` command rides inside the app (Contents/Helpers) and is linked
      # into ~/.local/bin from Settings.
      - target: CoreaderCLI
        embed: false
        link: false
      - sdk: PDFKit.framework
      - sdk: WebKit.framework
    postBuildScripts:
      - name: Embed coreader command
        script: |
          mkdir -p "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          cp -f "${BUILT_PRODUCTS_DIR}/coreader" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/coreader"
        inputFiles:
          - ${BUILT_PRODUCTS_DIR}/coreader
        outputFiles:
          - ${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/coreader
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.sushil.coreader
        PRODUCT_NAME: Coreader
        PRODUCT_MODULE_NAME: CoreaderApp
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/CoreaderApp/Info.plist
      properties:
        CFBundleDisplayName: Coreader
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
        CFBundleURLTypes:
          - CFBundleURLName: com.sushil.coreader
            CFBundleURLSchemes: [coreader]
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Kindle book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions: [mobi, azw3, azw, prc]

  CoreaderCLI:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/coreader-cli
    dependencies:
      - package: Coreader
        product: CoreaderKit
    settings:
      base:
        PRODUCT_NAME: coreader
        PRODUCT_BUNDLE_IDENTIFIER: com.sushil.coreader.cli
        SKIP_INSTALL: YES

schemes:
  Coreader:
    build:
      targets:
        Coreader: all
